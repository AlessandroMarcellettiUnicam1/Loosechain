services:
  blockchain:
    build: .
    command: npm run blockchain:node
    ports:
      - "8545:8545"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8545', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', method: 'eth_chainId', params: [], id: 1 }) }).then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 30
      start_period: 2s

  app:
    build: .
    command: npm run docker:start
    depends_on:
      blockchain:
        condition: service_healthy
    environment:
      - DEPLOYER_PRIVATE_KEY
    ports:
      - "9013:9013"
